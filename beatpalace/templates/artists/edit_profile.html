{% extends "base.html" %}

{% block title %}
Edit Artist Profile
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card bg-dark text-light border-secondary">

                <div class="card-body p-4">

                    <h3 class="mb-4">
                        Edit Artist Profile
                    </h3>

                    <form
                        method="POST"
                        enctype="multipart/form-data"
                    >

                        {% csrf_token %}

                        {% for field in form %}

                            <div class="mb-3">

                                <label class="form-label">
                                    {{ field.label }}
                                </label>

                                {{ field }}

                                {% for error in field.errors %}

                                    <div class="text-danger small">
                                        {{ error }}
                                    </div>

                                {% endfor %}

                            </div>

                        {% endfor %}

                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-primary"
                            >
                                Save Profile
                            </button>

                            <a
                                href="{% url 'artists:artist_profile'%}"
                                class="btn btn-outline-light"
                            >
                                Cancel
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
