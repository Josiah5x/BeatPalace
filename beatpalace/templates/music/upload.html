{% extends "base.html" %}

{% block title %}
Music Upload
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-sm bg-dark">

                <div class="card-body p-4">

                    <h3 class="mb-4">
                        Upload Music
                    </h3>

                    <form method="POST"
                          enctype="multipart/form-data">

                        {% csrf_token %}

                        {% for field in form %}

                            <div class="mb-3">

                                <label class="form-label">
                                    {{ field.label }}
                                </label>

                                {{ field }}

                                {% for error in field.errors %}

                                    <div class="text-danger small">
                                        {{ error }}
                                    </div>

                                {% endfor %}

                            </div>

                        {% endfor %}

                        <button
                            type="submit"
                            class="btn btn-primary">

                            <i class="bi bi-cloud-upload"></i>
                            Upload Music

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
